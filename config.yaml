system:
  name: "Multi-Agent Research Assistant"
  topic: "Explainable AI for novice users in education"
  max_iterations: 10
  timeout_seconds: 90

agents:
  planner:
    role: "Task Planner"
    enabled: true
    system_prompt: ""

  researcher:
    role: "Evidence Gatherer"
    enabled: true
    system_prompt: ""
    max_sources: 8

  writer:
    role: "Report Synthesizer"
    enabled: true
    system_prompt: ""

  critic:
    role: "Quality Verifier"
    enabled: true
    system_prompt: ""

models:
  default:
    provider: "openai"
    name: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 900

  judge:
    provider: "groq"
    name: "llama-3.1-8b-instant"
    temperature: 0.2
    max_tokens: 700

tools:
  web_search:
    enabled: true
    provider: "brave"
    max_results: 5

  paper_search:
    enabled: false
    provider: "semantic_scholar"
    max_results: 10

  citation_extraction:
    enabled: true

safety:
  enabled: true
  framework: "guardrails"
  log_events: true
  safety_log_file: "logs/safety_events.log"
  prohibited_categories:
    - "harmful_content"
    - "prompt_injection"
    - "pii_requests"
    - "off_topic_queries"
    - "misinformation"
  on_violation:
    action: "refuse"
    message: "I cannot process this request due to safety policies."

evaluation:
  enabled: true
  num_test_queries: 10
  criteria:
    - name: "relevance"
      weight: 0.25
      description: "How relevant is the response to the query?"
    - name: "evidence_quality"
      weight: 0.25
      description: "Quality of citations and evidence used"
    - name: "factual_accuracy"
      weight: 0.20
      description: "Factual correctness and consistency"
    - name: "safety_compliance"
      weight: 0.15
      description: "No unsafe or inappropriate content"
    - name: "clarity"
      weight: 0.15
      description: "Clarity and organization of response"

logging:
  level: "INFO"
  file: "logs/system.log"
  safety_log: "logs/safety_events.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"